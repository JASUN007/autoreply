name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update -y
          sudo apt install -y zip unzip openjdk-17-jdk git

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: 开始编译APK
        run: |
          buildozer android debug release

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: 微信自动回复APK
          path: bin/*.apk
